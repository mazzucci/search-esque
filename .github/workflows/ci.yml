name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features wasm --target wasm32-unknown-unknown

  parity:
    name: parity with elasticsearch
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.ml.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: The WebAssembly path answers like the native store
        run: |
          curl -sSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/
          wasm-pack build --release --target web --out-dir web/pkg -- --no-default-features --features wasm
          sh dev/vendor_sqlite.sh
          mkdir -p web/demo
          target/release/esque load --mapping fixtures/library/mapping.json --docs fixtures/library/docs.json --db web/demo/library.db
          cp fixtures/library/mapping.json web/demo/mapping.json
          node dev/wasm_parity.mjs
      - run: python3 dev/tokenizer_parity.py
      - run: python3 dev/tokenizer_parity.py --all
      - run: python3 dev/es_parity.py
